name: projectvault
description: ProjectVault - Personal Project Repository
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.5
  
  # Navigation
  go_router: ^10.0.0
  
  # HTTP & Networking
  dio: ^5.2.1+1
  connectivity_plus: ^4.0.1
  
  # Storage
  shared_preferences: ^2.2.1
  flutter_secure_storage: ^9.0.0
  
  # UI Components
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.0
  lottie: ^2.6.0
  
  # File Handling
  file_picker: ^5.3.3
  image_picker: ^1.0.0
  flutter_dropzone: ^4.0.3
  
  # Media
  video_player: ^2.7.0
  pdfx: ^2.4.0
  
  # Utils
  intl: 0.20.2
  url_launcher: ^6.1.11
  share_plus: ^7.0.2
  
  # Charts & Analytics
  fl_chart: ^0.63.0
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # Theme
  adaptive_theme: ^3.4.0
  
  # Error Handling
  flutter_native_splash: ^2.3.2
  flutter_local_notifications: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
          

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/ic_launcher.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/icons/ic_launcher_adaptive.png"

flutter_native_splash:
  color: "#6C63FF"
  image: "assets/images/splash_logo.png"
  branding: "assets/images/branding.png"
  color_dark: "#1A1A1A"
  image_dark: "assets/images/splash_logo_dark.png"
  android: true
  ios: true
  web: true